<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Video – AI Subtitle Studio</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="app-page">

<nav class="nav">
  <div class="nav-inner">
    <a class="logo" href="/">🎬 AI Subtitle Studio</a>
  </div>
</nav>

<main class="app-main">
  <div class="page-header">
    <h1>Upload Your Video</h1>
    <p>Drag & drop or browse to select a video file (MP4, MOV, MKV, AVI, WEBM · max 500 MB)</p>
  </div>

  <!-- Drop zone -->
  <div id="drop-zone" class="drop-zone" role="button" tabindex="0" aria-label="Upload area">
    <div id="drop-idle" class="drop-idle">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 16V4m0 0L8 8m4-4l4 4"/>
        <rect x="2" y="14" width="20" height="8" rx="2"/>
      </svg>
      <p class="drop-label">Drag & drop your video here</p>
      <p class="drop-sub">or</p>
      <label class="btn btn-secondary" for="file-input">Browse files</label>
      <input id="file-input" type="file" accept=".mp4,.mov,.mkv,.avi,.webm,video/*" hidden />
    </div>

    <div id="drop-preview" class="drop-preview hidden">
      <video id="video-preview" controls muted></video>
      <div class="file-info">
        <span id="file-name" class="file-name"></span>
        <span id="file-size" class="file-badge"></span>
      </div>
      <button id="change-file" class="btn btn-ghost">Change file</button>
    </div>
  </div>

  <!-- Progress bar -->
  <div id="upload-progress-wrap" class="progress-wrap hidden">
    <div class="progress-label">
      <span>Uploading…</span>
      <span id="progress-pct">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div id="progress-bar" class="progress-bar-fill" style="width:0%"></div>
    </div>
  </div>

  <!-- Error -->
  <div id="upload-error" class="alert alert-error hidden"></div>

  <!-- Action button -->
  <div class="action-row">
    <button id="upload-btn" class="btn btn-primary btn-lg" disabled>
      Continue →
    </button>
  </div>
</main>

<script src="/static/js/upload.js"></script>
</body>
</html>
